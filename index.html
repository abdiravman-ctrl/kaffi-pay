<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kaffi Pay</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#07101e;--gold:#FFD700;--gold2:#FFC200;--text:#eef2ff;--muted:#5c7a9e;--success:#00d4a0;--error:#ff4060;--warning:#ffaa00;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 40% at 5% -5%,rgba(255,215,0,0.06) 0%,transparent 55%),
             radial-gradient(ellipse 40% 35% at 95% 100%,rgba(255,194,0,0.04) 0%,transparent 50%);}

/* ── SCREENS ── */
.screen{display:none;position:relative;z-index:1;}
.screen.active{display:block;}
.wrap{max-width:480px;margin:0 auto;padding:0 18px 60px;}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px;}
.login-box{border-radius:22px;padding:34px 24px;width:100%;max-width:360px;animation:popIn .4s ease both;
  border:1px solid rgba(255,215,0,.1);background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(7,16,30,.97));backdrop-filter:blur(14px);}
.login-logo-area{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px;}
.login-logo-img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,215,0,.35);background:#07101e;}
.login-logo-name{font-family:'Playfair Display',serif;font-weight:900;font-size:1.65rem;}
.login-logo-name span{color:var(--gold);}

.login-field{margin-bottom:12px;}
.login-field label{display:block;font-size:0.67rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.login-field input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:13px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:.92rem;padding:11px 14px;outline:none;transition:all .2s;}
.login-field input:focus{background:rgba(255,215,0,.04);border-color:rgba(255,215,0,.22);box-shadow:0 0 0 3px rgba(255,215,0,.06);}
.login-field input::placeholder{color:rgba(92,122,158,.5);}
.login-btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101e;border:none;border-radius:999px;
  padding:13px;font-family:'DM Sans',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;transition:all .25s;
  margin-top:4px;box-shadow:0 4px 18px rgba(255,215,0,.2);}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(255,215,0,.3);}
.login-error{border-radius:10px;padding:9px 14px;font-size:.74rem;color:var(--error);margin-top:10px;display:none;text-align:center;border:1px solid rgba(255,64,96,.18);}
.login-attempts{font-size:.65rem;color:var(--muted);text-align:center;margin-top:7px;}

/* ── CLIENT HEADER ── */
.client-header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;border-bottom:1px solid rgba(255,215,0,.08);}
.logo-area{display:flex;align-items:center;gap:13px;}
.logo-img{width:55px;height:55px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,215,0,.35);background:#07101e;}
.logo-text .logo-name{font-family:'Playfair Display',serif;font-weight:900;font-size:1.38rem;}
.logo-text .logo-name span{color:var(--gold);}
.logo-text .logo-slogan{font-size:.56rem;color:var(--muted);margin-top:1px;}
.secure-badge{border-radius:999px;padding:5px 11px;font-size:.63rem;color:var(--success);font-weight:600;border:1px solid rgba(0,212,160,.2);}
.admin-link-btn{background:transparent;border:1px solid rgba(255,215,0,.15);border-radius:999px;padding:5px 12px;font-size:.65rem;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
.admin-link-btn:hover{border-color:rgba(255,215,0,.3);color:var(--gold);}

/* ── CLIENT BODY ── */
.hero{padding:12px 0 8px;animation:fadeUp .5s ease both;}
.hero-desc{font-size:.82rem;color:var(--muted);line-height:1.6;margin-bottom:12px;padding:10px 14px;border-radius:14px;border:1px solid rgba(255,215,0,.07);background:rgba(255,215,0,.02);}
.promo-box{border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;border:1px solid rgba(255,215,0,.15);background:linear-gradient(135deg,rgba(255,215,0,.05) 0%,transparent 100%);}
.promo-label{font-size:.67rem;color:var(--muted);margin-bottom:4px;}
.promo-code{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--gold);letter-spacing:3px;}
.copy-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101e;border:none;border-radius:999px;padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:.73rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.copy-btn.copied{background:linear-gradient(135deg,var(--success),#00ffcc);color:#fff;}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:999px;padding:4px;margin-bottom:12px;border:1px solid rgba(255,215,0,.1);background:rgba(255,255,255,.02);}
.tab-btn{padding:11px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:600;border-radius:999px;cursor:pointer;transition:all .3s;}
.tab-btn.active{background:rgba(255,215,0,.12);color:var(--gold);}
.tab-content{display:none;}.tab-content.active{display:block;animation:fadeUp .3s ease both;}
.form-card{border-radius:18px;padding:15px;border:1px solid rgba(255,215,0,.08);background:linear-gradient(160deg,rgba(255,255,255,.03) 0%,transparent 100%);}
.form-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:2px;}
.form-subtitle{font-size:.7rem;color:var(--muted);margin-bottom:14px;}
.field{margin-bottom:10px;}
.field label{display:flex;align-items:center;gap:5px;font-size:.66rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.92rem;padding:11px 14px;outline:none;transition:all .2s;}
.field input:focus{background:rgba(255,215,0,.04);border-color:rgba(255,215,0,.22);box-shadow:0 0 0 3px rgba(255,215,0,.06);}
.field input::placeholder{color:rgba(92,122,158,.5);}
.amount-wrap{position:relative;}
.amount-wrap input{padding-left:56px;font-size:1.05rem;font-weight:600;}
.currency-sym{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gold);font-weight:700;font-size:.78rem;pointer-events:none;}
.payment-box{border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid rgba(255,215,0,.12);background:linear-gradient(135deg,rgba(255,215,0,.04) 0%,transparent 70%);}
.payment-box-title{font-size:.65rem;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:10px;}
.payment-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;}
.payment-row+.payment-row{border-top:1px solid rgba(255,215,0,.07);}
.pay-label{font-size:.7rem;color:var(--muted);}
.pay-val{display:flex;align-items:center;gap:8px;}
.pay-num{font-size:1.05rem;font-weight:800;color:var(--gold);letter-spacing:2px;font-family:'Playfair Display',serif;}
.pay-name{font-size:.86rem;font-weight:600;}
.copy-num{background:transparent;border:1px solid rgba(255,215,0,.2);border-radius:999px;padding:4px 10px;font-size:.65rem;color:var(--gold);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;}
.method-display{display:flex;align-items:center;gap:11px;border-radius:13px;padding:11px 14px;border:1px solid rgba(233,30,140,.12);background:rgba(233,30,140,.04);margin-bottom:10px;}
.method-logo{width:34px;height:34px;background:linear-gradient(135deg,#e91e8c,#8b1a5e);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;color:#fff;font-family:'Playfair Display',serif;flex-shrink:0;}
.method-name{font-size:.84rem;font-weight:600;}
.method-tag{font-size:.6rem;color:var(--muted);}
.info-box{border-radius:14px;padding:11px 14px;margin-bottom:10px;border:1px solid rgba(255,215,0,.1);background:rgba(255,215,0,.02);}
.info-box-title{font-size:.75rem;font-weight:700;color:var(--gold);margin-bottom:8px;}
.info-steps{list-style:none;}
.info-steps li{font-size:.72rem;color:var(--muted);padding:3px 0;display:flex;gap:7px;line-height:1.5;}
.info-steps li::before{content:'→';color:var(--gold);flex-shrink:0;}
.submit-btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101e;border:none;border-radius:999px;padding:13px;font-family:'DM Sans',sans-serif;font-size:.94rem;font-weight:700;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;box-shadow:0 4px 18px rgba(255,215,0,.2);}
.submit-btn:hover{transform:translateY(-2px);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.spinner{width:14px;height:14px;border:2px solid rgba(10,18,32,.3);border-top-color:#07101e;border-radius:50%;animation:spin .7s linear infinite;display:none;}
.support-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:11px;border-radius:999px;border:1px solid rgba(37,211,102,.25);background:rgba(37,211,102,.05);color:#25d366;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;text-decoration:none;transition:all .2s;}
.support-btn:hover{background:rgba(37,211,102,.1);}
.client-footer{margin-top:18px;padding:10px 0 6px;text-align:center;border-top:1px solid rgba(255,215,0,.06);}
.footer-logo{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--gold);margin-bottom:3px;}
.footer-text{font-size:.62rem;color:var(--muted);line-height:1.7;}

/* ── ADMIN TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px;border-bottom:1px solid rgba(255,215,0,.07);margin-bottom:14px;}
.topbar-logo-area{display:flex;align-items:center;gap:10px;}
.topbar-logo-img{width:39px;height:39px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,215,0,.3);background:#07101e;}
.topbar-name{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:900;}
.topbar-name span{color:var(--gold);}
.topbar-sub{font-size:.59rem;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:7px;}
.role-badge{border-radius:999px;padding:5px 12px;font-size:.63rem;color:var(--gold);font-weight:700;text-transform:uppercase;border:1px solid rgba(255,215,0,.2);}
.logout-btn{background:transparent;border:1px solid rgba(255,64,96,.2);border-radius:999px;padding:5px 12px;font-size:.69rem;color:var(--error);cursor:pointer;font-family:'DM Sans',sans-serif;}
.client-btn{background:transparent;border:1px solid rgba(0,212,160,.2);border-radius:999px;padding:5px 12px;font-size:.69rem;color:var(--success);cursor:pointer;font-family:'DM Sans',sans-serif;}

/* ── ADMIN ALERTS ── */
.reserve-alert{border-radius:14px;padding:12px 16px;margin-bottom:12px;display:none;gap:11px;align-items:flex-start;border:1px solid rgba(255,170,0,.18);background:rgba(255,170,0,.04);}
.reserve-alert.show{display:flex;animation:pulse-warn 2.5s infinite;}
@keyframes pulse-warn{0%,100%{box-shadow:0 0 0 rgba(255,170,0,0);}50%{box-shadow:0 0 16px rgba(255,170,0,.12);}}
.new-order-alert{border-radius:14px;padding:11px 16px;margin-bottom:12px;display:none;gap:10px;align-items:center;border:1px solid rgba(0,212,160,.2);background:rgba(0,212,160,.05);cursor:pointer;}
.new-order-alert.show{display:flex;animation:pulse-green 2s infinite;}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 rgba(0,212,160,0);}50%{box-shadow:0 0 14px rgba(0,212,160,.15);}}

/* ── ADMIN NAV ── */
.nav-tabs{display:flex;gap:4px;border-radius:999px;padding:4px;margin-bottom:14px;overflow-x:auto;border:1px solid rgba(255,215,0,.08);background:rgba(255,255,255,.02);}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{flex:1;min-width:54px;padding:7px 4px;border:none;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.63rem;font-weight:600;border-radius:999px;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;}
.nav-tab span{font-size:.88rem;}
.nav-tab.active{background:rgba(255,215,0,.1);color:var(--gold);}
.notif-dot{position:absolute;top:4px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--error);display:none;}
.notif-dot.show{display:block;animation:blink 1s infinite;}
.page-section{display:none;}.page-section.active{display:block;animation:fadeUp .3s ease both;}

/* ── ADMIN MODE CARDS ── */
.mode-card{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.mode-item{border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:9px;border:1px solid rgba(255,170,0,.15);background:rgba(255,170,0,.04);}
.mode-dot{width:7px;height:7px;border-radius:50%;background:var(--warning);box-shadow:0 0 7px var(--warning);flex-shrink:0;}
.mode-name{font-size:.75rem;font-weight:600;}
.mode-tag{font-size:.59rem;color:var(--muted);}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{border-radius:16px;padding:14px;border:1px solid rgba(255,215,0,.07);background:rgba(255,255,255,.02);}
.stat-label{font-size:.61rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.stat-value{font-family:'Playfair Display',serif;font-size:1.28rem;font-weight:700;color:var(--gold);}
.stat-sub{font-size:.63rem;color:var(--muted);margin-top:3px;}
.stat-card.green .stat-value{color:var(--success);}
.stat-card.red .stat-value{color:var(--error);}
.stat-card.orange .stat-value{color:var(--warning);}
.stat-card.blue .stat-value{color:#5b9cff;}

/* ── CHART ── */
.chart-card{border-radius:18px;padding:14px;margin-bottom:14px;border:1px solid rgba(255,215,0,.07);background:rgba(255,255,255,.02);}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.chart-title{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;}
.chart-tabs{display:flex;gap:5px;}
.chart-tab{background:transparent;border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:4px 10px;font-size:.62rem;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;}
.chart-tab.active{border-color:rgba(255,215,0,.22);color:var(--gold);}
.chart-wrap{height:150px;}

/* ── ORDERS ── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;}
.section-title{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;}
.action-btn{background:transparent;border:1px solid rgba(255,215,0,.2);border-radius:999px;padding:6px 13px;font-size:.65rem;color:var(--gold);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;}
.order-filter{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.order-filter::-webkit-scrollbar{display:none;}
.filter-chip{background:transparent;border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:5px 12px;font-size:.65rem;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.filter-chip.active{border-color:rgba(255,215,0,.22);color:var(--gold);}
.search-wrap{position:relative;margin-bottom:10px;}
.search-wrap input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:999px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.82rem;padding:10px 12px 10px 36px;outline:none;}
.search-wrap input:focus{background:rgba(255,215,0,.04);border-color:rgba(255,215,0,.18);}
.search-wrap input::placeholder{color:rgba(92,122,158,.5);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.83rem;pointer-events:none;}
.tx-list{display:flex;flex-direction:column;gap:7px;}
.tx-item{border-radius:14px;padding:11px 13px;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.02);animation:fadeUp .3s ease both;}
.tx-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.tx-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.88rem;flex-shrink:0;}
.tx-icon.depot{background:rgba(0,212,160,.12);}
.tx-icon.retrait{background:rgba(233,30,140,.12);}
.tx-info{flex:1;min-width:0;}
.tx-ref{font-size:.74rem;font-weight:600;margin-bottom:1px;}
.tx-meta{font-size:.61rem;color:var(--muted);}
.tx-right{text-align:right;flex-shrink:0;}
.tx-amount{font-size:.84rem;font-weight:700;}
.tx-amount.depot{color:var(--success);}
.tx-amount.retrait{color:var(--error);}
.tx-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;}
.tx-status{font-size:.6rem;padding:3px 9px;border-radius:999px;display:inline-block;}
.tx-status.pending{background:rgba(255,170,0,.1);color:var(--warning);border:1px solid rgba(255,170,0,.2);}
.tx-status.confirmed{background:rgba(0,212,160,.1);color:var(--success);border:1px solid rgba(0,212,160,.2);}
.tx-status.rejected{background:rgba(255,64,96,.1);color:var(--error);border:1px solid rgba(255,64,96,.2);}
.tx-actions{display:flex;gap:5px;}
.tx-btn{border:none;border-radius:999px;padding:4px 10px;font-size:.62rem;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;}
.tx-btn.confirm{background:rgba(0,212,160,.12);color:var(--success);border:1px solid rgba(0,212,160,.2);}
.tx-btn.reject{background:rgba(255,64,96,.08);color:var(--error);border:1px solid rgba(255,64,96,.15);}
.tx-detail{font-size:.64rem;color:var(--muted);padding-top:5px;border-top:1px solid rgba(255,255,255,.04);display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.tx-detail span{background:rgba(255,255,255,.03);border-radius:6px;padding:2px 7px;}
.empty-state{text-align:center;padding:32px 20px;color:var(--muted);font-size:.79rem;}
.empty-icon{font-size:2rem;margin-bottom:7px;}

/* ── RESERVES ── */
.reserve-card{border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,215,0,.07);background:rgba(255,255,255,.02);}
.reserve-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.reserve-name{font-size:.75rem;font-weight:600;}
.reserve-djf{font-size:.88rem;font-weight:700;}
.reserve-track{height:5px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;margin-bottom:6px;}
.reserve-bar{height:100%;border-radius:999px;transition:width 1s ease;}
.reserve-bar.gold{background:linear-gradient(90deg,var(--gold2),var(--gold));}
.reserve-bar.pink{background:linear-gradient(90deg,#e91e8c,#ff6b9d);}
.reserve-bar.danger{background:linear-gradient(90deg,var(--error),#ff8a9a);}
.reserve-edit-row{display:flex;gap:8px;margin-top:10px;}
.reserve-input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.82rem;padding:8px 11px;outline:none;}
.reserve-input:focus{border-color:rgba(255,215,0,.22);background:rgba(255,215,0,.04);}
.reserve-save-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101e;border:none;border-radius:10px;padding:8px 14px;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer;}

/* ── EXPORT ── */
.export-btns{display:flex;gap:10px;margin-bottom:12px;}
.export-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:10px;font-size:.72rem;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;}
.export-btn:hover{border-color:rgba(255,215,0,.2);color:var(--gold);}

/* ── AGENTS ── */
.agent-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px;}
.agent-item{border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.02);}
.agent-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:800;color:#07101e;flex-shrink:0;font-family:'Playfair Display',serif;}
.agent-info{flex:1;}
.agent-name{font-size:.8rem;font-weight:600;}
.agent-role{font-size:.62rem;color:var(--muted);}
.agent-del{background:transparent;border:1px solid rgba(255,64,96,.18);border-radius:999px;padding:5px 10px;font-size:.64rem;color:var(--error);cursor:pointer;font-family:'DM Sans',sans-serif;}
.add-agent-form{border-radius:18px;padding:14px;margin-bottom:12px;display:none;border:1px solid rgba(255,215,0,.09);background:rgba(255,215,0,.02);}
.add-agent-form.show{display:block;animation:fadeUp .3s ease both;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.mini-field label{display:block;font-size:.63rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.mini-field input,.mini-field select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.81rem;padding:9px 11px;outline:none;-webkit-appearance:none;appearance:none;}
.mini-field input:focus,.mini-field select:focus{background:rgba(255,215,0,.04);border-color:rgba(255,215,0,.18);}
.mini-field input::placeholder{color:rgba(92,122,158,.5);}
.mini-field select option{background:#07101e;}
.add-agent-btn{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101e;border:none;border-radius:999px;padding:10px;font-family:'DM Sans',sans-serif;font-size:.81rem;font-weight:700;cursor:pointer;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:900;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{border-radius:22px;padding:26px 22px;width:100%;max-width:360px;animation:popIn .3s ease both;text-align:center;border:1px solid rgba(255,215,0,.12);background:rgba(10,20,34,.98);backdrop-filter:blur(16px);}
.modal-icon{font-size:2.4rem;margin-bottom:11px;}
.modal-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;margin-bottom:6px;}
.modal-desc{font-size:.77rem;color:var(--muted);line-height:1.6;margin-bottom:12px;}
.modal-detail{border-radius:13px;padding:12px;margin-bottom:12px;font-size:.76rem;text-align:left;border:1px solid rgba(255,215,0,.09);background:rgba(255,215,0,.02);}
.modal-detail div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.modal-detail div:last-child{border-bottom:none;}
.modal-detail div span:last-child{color:var(--gold);font-weight:700;}
.modal-note{font-size:.7rem;color:var(--warning);margin-bottom:14px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,170,0,.15);background:rgba(255,170,0,.04);}
.modal-close{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101e;border:none;border-radius:999px;padding:11px 32px;font-family:'DM Sans',sans-serif;font-size:.87rem;font-weight:700;cursor:pointer;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);border-radius:999px;padding:10px 20px;font-size:.8rem;color:var(--text);border:1px solid rgba(255,215,0,.1);background:rgba(7,16,30,.97);backdrop-filter:blur(12px);box-shadow:0 6px 26px rgba(0,0,0,.35);opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{border-color:rgba(0,212,160,.22);}
.toast.error{border-color:rgba(255,64,96,.22);}
.toast.warning{border-color:rgba(255,170,0,.22);}

@keyframes fadeUp{from{opacity:0;transform:translateY(11px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.detail-row:last-child{border-bottom:none;}
.detail-label{font-size:0.71rem;color:var(--muted);}
.detail-value{font-size:0.78rem;font-weight:600;color:var(--text);text-align:right;max-width:60%;word-break:break-all;}
.tl-step{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative;}
.tl-step:last-child{padding-bottom:0;}
.tl-step::before{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:rgba(255,255,255,0.07);}
.tl-step:last-child::before{display:none;}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.82rem;flex-shrink:0;}
.tl-dot.done{background:rgba(0,212,160,0.15);border:1px solid rgba(0,212,160,0.3);}
.tl-dot.active{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.3);animation:pulse-tl 2s infinite;}
.tl-dot.wait{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);}
@keyframes pulse-tl{0%,100%{box-shadow:0 0 0 rgba(255,215,0,0);}50%{box-shadow:0 0 10px rgba(255,215,0,0.2);}}
.tl-title{font-size:0.78rem;font-weight:600;margin-bottom:2px;}
.tl-desc{font-size:0.66rem;color:var(--muted);}

</style>
</head>
